name: Create Jira Ticket

on: 
  issues:
    types:
      - opened

jobs:
  create_jira:
    name: Create Jira Ticket
    runs-on: ubuntu-latest
    environment: IssueTracker
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Login
      uses: atlassian/gajira-login@ca13f8850ea309cf44a6e4e0c49d9aa48ac3ca4c # v3.0.0
      env:
        JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_TOKEN }}
        JIRA_EPIC_KEY: ${{ secrets.JIRA_EPIC_KEY }}
        JIRA_PROJECT: ${{ secrets.JIRA_PROJECT }}

    - name: Create
      id: create
      uses: atlassian/gajira-create@1ff0b6bd115a780592b47bfbb63fc4629132e6ec # v3.0.0
      with:
        project: ${{ secrets.JIRA_PROJECT }}
        issuetype: Bug
        summary: |
          [${{ github.event.repository.name }}] (${{ github.event.issue.number }}): ${{ github.event.issue.title }}
        description: |
          Github Link: ${{ github.event.issue.html_url }}
          ${{ github.event.issue.body }}
        fields: '{"parent": {"key": "${{ secrets.JIRA_EPIC_KEY }}"}}'

    - name: Log created issue
      run: echo "Issue ${{ steps.create.outputs.issue }} was created"
